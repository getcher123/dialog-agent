name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main", "feature/betancourt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  VITE_BASE: "/dialog-agent/"
  VITE_BACKEND_ORIGIN: ${{ vars.VITE_BACKEND_ORIGIN }}
  BETANCOURT_API_BASE: ${{ vars.BETANCOURT_API_BASE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout isolated Betancourt frontend
        uses: actions/checkout@v4
        with:
          ref: feature/betancourt
          path: variant
          sparse-checkout: betancourt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Add Betancourt route without replacing the main frontend
        run: node variant/betancourt/tools/build-pages.mjs frontend/dist/betancourt

      - name: Disable Jekyll
        run: touch frontend/dist/.nojekyll

      - name: SPA 404 fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
