name: Check Betancourt Gateway
on:
  push:
    branches: [feature/betancourt]
  pull_request:
    paths: ['betancourt/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test betancourt/tests/gateway.test.mjs
      - run: node betancourt/tools/build-pages.mjs /tmp/betancourt-public
