<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Бетанкур · Вопросы о доме</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">Консультант по документу</span><h1>Бетанкур<span class="dot">.</span></h1><p class="intro">Спросите о доме.<br>Посмотрите, на чём основан ответ.</p></header>
    <div class="workspace">
      <aside>
        <section class="access"><h2>Доступ к консультации</h2><label for="invitation">Код приглашения</label><input id="invitation" type="password" autocomplete="off" spellcheck="false" placeholder="Введите код"><button id="forget" type="button" class="subtle">Забыть код и очистить диалог</button></section>
      </aside>
      <section class="conversation" aria-label="Вопросы и ответы">
        <div class="conversation-heading"><h2>Вопросы о доме</h2></div>
        <div id="messages" aria-live="polite" aria-relevant="additions"></div>
        <form id="question-form"><label for="question">Ваш вопрос</label><textarea id="question" rows="3" maxlength="2000" required placeholder="Какие окна предусмотрены в квартирах и коммерческих помещениях?"></textarea><div class="question-suggestions" aria-label="Примеры вопросов"><button type="button" data-question="Сколько квартир, секций и надземных этажей?">Сколько квартир, секций и этажей?</button><button type="button" data-question="Как очищается вода в квартирах?">Как очищается вода в квартирах?</button><button type="button" data-question="Сравни окна квартиры и коммерческого помещения">Чем отличаются окна?</button><button type="button" data-question="В квартире уже установлены кондиционер и рекуперация?">Что уже установлено в квартире?</button></div><div class="composer-footer"><span id="count">0 / 2000</span><button id="send" type="submit">Задать вопрос <span aria-hidden="true">↗</span></button></div></form>
        <p id="status" role="status"></p>
        <p id="error" role="alert" hidden></p>
      </section>
    </div>
  </main>
</body>
</html>
