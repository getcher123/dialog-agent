name: betancourt
services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports:
      - '127.0.0.1:6333:6333'
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
      RAG_MAX_COMPLETION_TOKENS: ${RAG_MAX_COMPLETION_TOKENS:-1000}
      RAG_TRACE: ${RAG_TRACE:-false}
      PILOT_TOKEN: ${PILOT_TOKEN:-}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3310}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - '127.0.0.1:3310:3000'
    depends_on:
      - qdrant
volumes:
  qdrant_data:
